<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechZone Electronics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">⚡ <span class="logo-text">TechZone</span> <span class="veg-badge">🔥 Best Deals</span></div>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="email-marketing.html">Marketing</a></li>
                    <li><a href="affiliate.html">Affiliate</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <h2>🔐 Login</h2>
            <form action="index.html">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="submit-btn fancy-btn">Login</button>
            </form>
            <div class="auth-link">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
                <p><a href="index.html">Continue without login</a></p>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 TechZone Electronics. All Rights Reserved.</p>
            </div>
        </div>
    </footer>
</body>
</html>
